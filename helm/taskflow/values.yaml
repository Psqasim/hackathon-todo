# Default values for TaskFlow Helm chart
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# Namespace configuration
namespace:
  name: taskflow
  labels:
    app: taskflow
    phase: "4"

# Backend configuration
backend:
  replicaCount: 1
  image:
    repository: taskflow-backend
    tag: latest
    pullPolicy: Never  # Use local image for development

  service:
    type: ClusterIP
    port: 8000
    targetPort: 7860

  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "500Mi"
      cpu: "500m"

  # Health probes
  livenessProbe:
    httpGet:
      path: /health
      port: 7860
    initialDelaySeconds: 60
    periodSeconds: 30
    timeoutSeconds: 10
    failureThreshold: 5

  readinessProbe:
    httpGet:
      path: /health
      port: 7860
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

  startupProbe:
    httpGet:
      path: /health
      port: 7860
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 60  # 600 seconds max startup time

  # Security context
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    fsGroup: 1000

# Frontend configuration
frontend:
  replicaCount: 1
  image:
    repository: taskflow-frontend
    tag: latest
    pullPolicy: Never  # Use local image for development

  service:
    type: LoadBalancer
    port: 80
    targetPort: 3000

  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "512Mi"
      cpu: "500m"

  # Health probes
  livenessProbe:
    httpGet:
      path: /
      port: 3000
    initialDelaySeconds: 20
    periodSeconds: 10
    timeoutSeconds: 5

  readinessProbe:
    httpGet:
      path: /
      port: 3000
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 5

  # Security context
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000

# Configuration values (non-sensitive)
config:
  jwtAlgorithm: "HS256"
  jwtExpirationDays: "7"
  backendUrl: "http://backend-service:8000"
  nextPublicApiUrl: "http://backend-service:8000"
  mcpBackendUrl: "http://localhost:7860"  # MCP server calls FastAPI on port 7860
  logLevel: "info"

# Secrets (sensitive values - provide via --set or values file)
# These should be base64 encoded when applied
secrets:
  # Database
  databaseUrl: ""  # Override with actual value

  # JWT
  jwtSecretKey: ""  # Override with actual value

  # OpenAI
  openaiApiKey: ""  # Override with actual value

  # Google OAuth
  googleClientId: ""  # Override with actual value
  googleClientSecret: ""  # Override with actual value

  # GitHub OAuth
  githubClientId: ""  # Override with actual value
  githubClientSecret: ""  # Override with actual value

# Image pull secrets (if using private registry)
imagePullSecrets: []

# Dapr configuration (Phase 5)
dapr:
  enabled: false  # Set to true to enable Dapr sidecars
  pubsubName: taskflow-pubsub
  logLevel: info

  # Dapr sidecar resource limits
  sidecarCpuLimit: "500m"
  sidecarMemoryLimit: "256Mi"
  sidecarCpuRequest: "100m"
  sidecarMemoryRequest: "128Mi"

  # Bulk subscribe configuration
  bulkSubscribe:
    enabled: false
    maxMessagesCount: 100
    maxAwaitDurationMs: 1000

# Kafka configuration (Phase 5)
kafka:
  # Bootstrap server (Strimzi cluster in kafka namespace)
  bootstrapServer: taskflow-kafka-kafka-bootstrap.kafka.svc.cluster.local:9092

  # Consumer configuration
  consumerGroup: taskflow-group
  clientID: taskflow-client

  # Authentication
  authRequired: false

  # Consumer retry
  consumeRetryEnabled: true

  # Offset management
  initialOffset: newest

  # Message size limit (1MB)
  maxMessageBytes: "1024000"

# Notification Service configuration (Phase 5)
notification:
  enabled: false  # Set to true to deploy notification service
  replicas: 1

  image: taskflow-notification
  tag: latest
  imagePullPolicy: Never  # Use local image for Minikube

  port: 8001
  logLevel: INFO

  service:
    type: ClusterIP
    port: 8001

  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "250m"

  # Health probes
  livenessProbe:
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

  readinessProbe:
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 5
    failureThreshold: 3

  # Security context
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    fsGroup: 1000
