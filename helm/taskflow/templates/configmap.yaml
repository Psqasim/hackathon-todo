apiVersion: v1
kind: ConfigMap
metadata:
  name: taskflow-config
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "taskflow.labels" . | nindent 4 }}
data:
  # JWT Configuration
  JWT_ALGORITHM: {{ .Values.config.jwtAlgorithm | quote }}
  JWT_EXPIRATION_DAYS: {{ .Values.config.jwtExpirationDays | quote }}

  # Service URLs (internal cluster communication)
  BACKEND_URL: {{ .Values.config.backendUrl | quote }}
  NEXT_PUBLIC_API_URL: {{ .Values.config.nextPublicApiUrl | quote }}
  MCP_BACKEND_URL: {{ .Values.config.mcpBackendUrl | quote }}

  # Logging
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}

  {{- if .Values.dapr.enabled }}
  # Dapr Configuration
  DAPR_ENABLED: "true"
  DAPR_HTTP_PORT: "3500"
  DAPR_GRPC_PORT: "50001"
  PUBSUB_NAME: {{ .Values.dapr.pubsubName | default "taskflow-pubsub" | quote }}
  {{- else }}
  DAPR_ENABLED: "false"
  {{- end }}
