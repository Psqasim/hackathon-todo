{{- if .Values.dapr.enabled }}
{{- if .Values.notification.enabled }}
apiVersion: dapr.io/v2alpha1
kind: Subscription
metadata:
  name: reminders-subscription
  namespace: {{ .Values.namespace.name }}
spec:
  # Pub/sub component name
  pubsubname: {{ .Values.dapr.pubsubName | default "taskflow-pubsub" }}

  # Topic to subscribe to
  topic: reminders

  # Route configuration
  routes:
    # Default route for reminder events
    default: /events/reminders

  # Scopes: which apps can use this subscription
  scopes:
    - notification-service

  # Bulk subscribe (optional, improves throughput)
  bulkSubscribe:
    enabled: {{ .Values.dapr.bulkSubscribe.enabled | default false }}
    maxMessagesCount: {{ .Values.dapr.bulkSubscribe.maxMessagesCount | default 100 }}
    maxAwaitDurationMs: {{ .Values.dapr.bulkSubscribe.maxAwaitDurationMs | default 1000 }}
{{- end }}
{{- end }}
