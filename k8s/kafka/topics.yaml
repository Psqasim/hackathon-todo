apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: task-events
  namespace: kafka
  labels:
    strimzi.io/cluster: taskflow-kafka
spec:
  partitions: 3
  replicas: 1
  config:
    # Retention: 7 days (604800000 ms)
    retention.ms: 604800000
    # Segment size: 100MB
    segment.bytes: 104857600
    # Compression for better storage efficiency
    compression.type: producer
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: reminders
  namespace: kafka
  labels:
    strimzi.io/cluster: taskflow-kafka
spec:
  partitions: 1
  replicas: 1
  config:
    # Retention: 7 days (604800000 ms)
    retention.ms: 604800000
    # Segment size: 50MB (smaller for reminders topic)
    segment.bytes: 52428800
    # Compression for better storage efficiency
    compression.type: producer
