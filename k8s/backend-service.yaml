apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: taskflow
  labels:
    app: taskflow-backend
spec:
  type: ClusterIP  # Internal only
  selector:
    app: taskflow-backend
  ports:
  - name: http
    protocol: TCP
    port: 8000        # External port (within cluster)
    targetPort: 7860  # Container port
