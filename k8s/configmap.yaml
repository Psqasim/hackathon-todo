apiVersion: v1
kind: ConfigMap
metadata:
  name: taskflow-config
  namespace: taskflow
  labels:
    app: taskflow
data:
  # JWT Configuration
  JWT_ALGORITHM: "HS256"
  JWT_EXPIRATION_DAYS: "7"

  # Service URLs (internal cluster communication)
  # BACKEND_URL: Used by backend for OAuth callbacks (must be publicly accessible!)
  # OAuth callbacks go through the proxy: http://localhost/api/proxy/auth/google/callback
  BACKEND_URL: "http://localhost/api/proxy"
  # NEXT_PUBLIC_API_URL: Not used with API proxy, but kept for reference
  NEXT_PUBLIC_API_URL: "http://backend-service:8000"
  # MCP_BACKEND_URL: Used by chatbot agent to call backend API (internal pod address)
  # Backend listens on port 7860 inside the container
  MCP_BACKEND_URL: "http://localhost:7860"

  # Logging
  LOG_LEVEL: "info"
